name: Dependabot CI
# separate workflow for Dependabot that avoids using secrets
# as Dependabot does not have access to regular secrets
on:
  pull_request:
  
jobs:
  tests:
    name: Dependabot workflow
    runs-on: ubuntu-20.04
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2
    - name: Build Docker container
      env:
        BRANCH: ${{ github.head_ref }} 
      run: docker pull mdmc/mdmc:latest && docker build --cache-from mdmc/mdmc:latest -t mdmc/mdmc:ci-$BRANCH -f "$(pwd)"/build/Docker/Dockerfile . || exit 1 
    - name: Run tests
      env:
        BRANCH: ${{ github.head_ref }} 
      run: docker run -t --mount type=bind,source="$(pwd)",target="$(pwd)" mdmc/mdmc:ci-$BRANCH python3 -m pytest -s "$(pwd)"/tests/; [ $? -eq 0 ]
    - name: Push image
      env:
        BRANCH: ${{ github.head_ref }}
        DOCKER_PASSWORD: ${{ secrets.DEPENDABOT_DOCKER }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "mdmc" --password-stdin
        docker push mdmc/mdmc:ci-$BRANCH
