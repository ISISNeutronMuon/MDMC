name: Dependabot CI
# separate workflow for Dependabot that avoids using secrets
# as Dependabot does not have access to secrets
on:
  pull_request:
  
jobs:
  tests:
    name: Dependabot workflow
    runs-on: ubuntu-20.04
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2
    - name: Build Docker container
      env:
        BRANCH: ${{ github.head_ref }} 
      run: docker build -t mdmc/mdmc:ci-$BRANCH -f "$(pwd)"/build/Docker/Dockerfile . || exit 1 
    - name: Run tests
      env:
        BRANCH: ${{ github.head_ref }} 
      run: docker run -t --mount type=bind,source="$(pwd)",target="$(pwd)" mdmc/mdmc:ci-$BRANCH python3 -m pytest -s "$(pwd)"/tests/; [ $? -eq 0 ]
