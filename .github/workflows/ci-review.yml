name: review
# contains jobs which run when a PR is reviewed or approved
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

jobs:
  build:
    name: Build docker container
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: fetch  # grabs master to compare if Docker build files changed
        run: git fetch origin master

      - name: Check and build container
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: source .github/scripts/build_container.sh

  docker_tests:
    name: Docker including MD tests
    needs: build # so it can use new docker image if docker image has changed
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11.2'
          architecture: x64
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Pull Docker Image
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          docker pull -q mdmc/mdmc:ci-$BRANCH || docker pull -q mdmc/mdmc:latest
          echo "IMG_NAME=$(echo $(docker images --filter=reference='mdmc/mdmc:*' --format "{{.Repository}}:{{.Tag}}"))" >> $GITHUB_ENV
      - name: Run tests
        env:
          TESTSET: ${{ matrix.testset }}
        run: |
          docker run -t --mount type=bind,source="$(pwd)",target="$(pwd)" ${{ env.IMG_NAME }} python3 -m pytest -s $(pwd)/tests/;[ $? -eq 0 ]
          exit 0

      - name: Copy coverage
        run: docker cp $(docker ps -lq):/home/coverage.xml coverage.xml || exit 0
        continue-on-error: true

      - name: Copy profiling info, download profile script reqs. and profile
        run: |
          sudo docker cp $(docker ps -lq):/home/prof/ prof/
          pip3 install pandas
          python3 .github/scripts/process_prof_data.py prof/ || exit 1

      - name: Upload code coverage report
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  basic_tests:
    name: Non-container and not inc MD tests
    runs-on: ubuntu-22.04
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11.2'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: apt-get
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin
    - name: pip install
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -r requirements.txt
        python3 -m pip install -r .dev_requirements.txt

    - name: Run tests
      #we have to use --ignore instead of -m "not lammps" because pytest reads the whole script before deselecting - thus throwing an error about not having lammps before the mark can be filtered out
      run: python3 -m pytest -s $(pwd)/tests/ --ignore tests/MD/packmol --ignore=tests/system_tests --ignore=tests/MD/test_simulation_lammps.py --ignore=tests/test_imports.py --ignore=tests/MD/test_trajectory.py

    - name: Uninstall
      run: pip3 uninstall -y MDMC

  windows:
    name: Python 3.9.0 on Windows (installation check only)
    runs-on: windows-latest
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11.2'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install
      run: |
        pip3 install --upgrade pip
        pip3 install wheel
        pip3 install .

    - name: Uninstall
      run: pip3 uninstall -y MDMC

  singularity:
    name: Singularity tests
    needs: build # so it can use new docker image if docker image has changed
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.13'
      - name: Get Singularity requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y flawfinder squashfs-tools uuid-dev libuuid1 libffi-dev libssl-dev libssl1.1 libarchive-dev libgpgme11-dev libseccomp-dev
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Singularity
        run: source .github/scripts/singularity_setup.sh

      - name: Run tests
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
           singularity pull mdmc.sif docker://mdmc/mdmc:ci-$BRANCH || singularity pull mdmc.sif docker://mdmc/mdmc:latest
           singularity exec mdmc.sif pip3 install --upgrade pip
           singularity exec mdmc.sif pip3 install .
           singularity exec mdmc.sif python3 -m pytest -s $(pwd)/tests/

  parallel_tests:
    name: Parallel tests
    needs: build # so it can use new docker image if docker image has changed
    runs-on: ubuntu-22.04
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
          python-version: '3.11.2'
          architecture: x64
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Pull Docker Image
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          docker pull -q mdmc/mdmc:ci-$BRANCH || docker pull -q mdmc/mdmc:latest
          echo "IMG_NAME=$(echo $(docker images --filter=reference='mdmc/mdmc:*' --format "{{.Repository}}:{{.Tag}}"))" >> $GITHUB_ENV
    - name: Run tests
      env:
        BRANCH: ${{ github.event.pull_request.head.ref }}
      run: |
        docker run -t --mount type=bind,source="$(pwd)",target="$(pwd)" --env OMP_NUM_THREADS=4 ${{ env.IMG_NAME }} python3 -m pytest -s $(pwd)/tests/;[ $? -eq 0 ]
        exit 0

    - name: Copy coverage
      run: docker cp $(docker ps -lq):/home/coverage.xml coverage.xml || exit 0
      continue-on-error: true

    - name: Upload code coverage report
      uses: codecov/codecov-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  documentation:
    name: Documentation
    needs: build # so it can use new docker image if docker image has changed
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Pull Docker Image
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          docker pull -q mdmc/mdmc:ci-$BRANCH || docker pull -q mdmc/mdmc:latest
          echo "IMG_NAME=$(echo $(docker images --filter=reference='mdmc/mdmc:*' --format "{{.Repository}}:{{.Tag}}"))" >> $GITHUB_ENV
      - name: Create Docker Container
        run: echo "CONTAINER_HASH=$(echo $(docker run -d -it --mount type=bind,source="$(pwd)",target="$(pwd)" ${{ env.IMG_NAME }}))" >> $GITHUB_ENV
      - name: Install Requirements
        run: docker exec ${{ env.CONTAINER_HASH }} /bin/bash -c "cd $(pwd) && apt-get update && apt-get install pandoc -y && pip3 install ."
      - name: Make Documentation
        run: docker exec ${{ env.CONTAINER_HASH }} /bin/bash -c "make -d -C $(pwd)/doc html"
