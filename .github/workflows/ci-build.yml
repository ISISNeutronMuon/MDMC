name: CI
# contains jobs which run on every pull request
on:
  pull_request:

jobs:
  build:
    name: Build docker container
    runs-on: ubuntu-22.04
    # if this is a dependabot PR, skip all this and do the Dependabot workflow instead
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: fetch  # grabs master to compare if Docker build files changed
        run: git fetch origin master

      - name: Check and build container
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          BRANCH: ${{ github.head_ref }}
        run: source .github/scripts/build_container.sh

  tests:
    name: Docker tests
    needs: build # so it can use new docker image if docker image has changed
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        testset: ["not lammps"]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'
          architecture: x64
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Pull Docker Image
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          docker pull -q mdmc/mdmc:ci-$BRANCH || docker pull -q mdmc/mdmc:latest
          echo "IMG_NAME=$(echo $(docker images --filter=reference='mdmc/mdmc:*' --format "{{.Repository}}:{{.Tag}}"))" >> $GITHUB_ENV
      - name: Run tests
        env:
          TESTSET: ${{ matrix.testset }}
        run: |
          docker run -t --mount type=bind,source="$(pwd)",target="$(pwd)" ${{ env.IMG_NAME }} python3 -m pytest -m "$TESTSET" -s $(pwd)/tests/;[ $? -eq 0 ]
          exit 0 

      - name: Copy coverage
        run: docker cp $(docker ps -lq):/home/coverage.xml coverage.xml || exit 0
        continue-on-error: true

      - name: Upload code coverage report
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  linting:
    name: Pylint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: apt get
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin python3-tk
        # we use cat and grep here to get the version-pinned pylint version from .dev_requirements.txt; thus we can version control pylint
      - name: pip3 install
        run: |
          sudo pip3 install --upgrade pip
          sudo pip3 install -r requirements.txt
          sudo pip3 install --upgrade $(cat .dev_requirements.txt | grep pylint)
      - name: pylint
        run: |
          pylint MDMC || pylint-exit $? --error-fail --warn-fail --refactor-fail --convention-fail
          exit $?

  notebooks:
    name: Notebooks
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
          architecture: x64
      - name: Pull Docker Image
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          docker pull -q mdmc/mdmc:ci-$BRANCH || docker pull -q mdmc/mdmc:latest
          echo "IMG_NAME=$(echo $(docker images --filter=reference='mdmc/mdmc:*' --format "{{.Repository}}:{{.Tag}}"))" >> $GITHUB_ENV
      - name: Create Docker Container
        run: |
          echo "CONTAINER_HASH=$(echo $(docker run -d -it --mount type=bind,source="$(pwd)",target="/home/mdmc_home" -w "/home/mdmc_home" ${{ env.IMG_NAME }}))" >> $GITHUB_ENV
      - name: Install Requirements
        run: docker exec ${{ env.CONTAINER_HASH }} /bin/bash -c "apt-get install pandoc -y && pip install . -r requirements.txt -r .dev_requirements.txt"
      - name: Convert Notebooks
        run: docker exec ${{ env.CONTAINER_HASH }} /bin/bash -c "jupyter nbconvert --config doc/tutorials/notebook-test-config.py"
      - name: Test Notebooks
        run: docker exec ${{ env.CONTAINER_HASH }} /bin/bash -c "pytest --nbmake --nbmake-timeout=2000 -k ".nbconvert.ipynb""

  type-checking:
    name: Mypy
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: apt get
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin
    - name: pip3 install
      run: |
        sudo pip3 install --upgrade pip
        sudo pip3 install -r requirements.txt
    - name: mypy
      run: |
        cd MDMC
        mypy . --show-error-codes --pretty