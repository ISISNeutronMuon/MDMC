name: CI
# contains jobs which run on every pull request
on:
  pull_request:

env:
  ruff_version: 0.15.5

jobs:
  doc-deploy:
    name: Documentation-deploy
    runs-on: ubuntu-22.04
    steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11.2'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install MDMC
      run: pip install .[test,docs]
    - name: Build documentation
      run: |
        sudo apt-get update
        sudo apt-get install pandoc -y
        sphinx-apidoc MDMC -o doc/reference/api/
        make -d -C doc html
    - name: Deploy
      env:
        token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      run: |
        git clone https://github.com/MDMCproject/MDMCproject.github.io
        cd ./MDMCproject.github.io
        cp -r  ../doc/_build/html/* ../MDMCproject.github.io/
        git config --global user.name "Github Actions"
        git add *
        git commit -a -m "CI deployment"
        git merge -X ours master
        git push https://$token@github.com/MDMCproject/MDMCproject.github.io

  tests:
    name: Tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        testset: ["not lammps and not dlpoly"]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.2'
          architecture: x64
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install MDMC
        run: pip install .[test,docs]
      - name: Run tests
        working-directory: tests
        run: pytest

  notebooks:
    name: Notebook test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.2'
          architecture: x64
      - name: Install Requirements
        run: sudo apt-get install pandoc -y
      - name: Install MDMC
        run: pip install .[test,docs]
      - name: Convert Notebooks
        run: jupyter nbconvert --config doc/notebook-test-config.py
      - name: Test Notebooks
        run: pytest --nbmake --nbmake-timeout=300 -k '.nbconvert.ipynb'

  linting:
    name: Lint - ${{ matrix.type }}
    strategy:
      fail-fast: false
      matrix:
        type: ["check", "format --check"]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          src: MDMC
          args: ${{ matrix.type }}
          version: ${{ env.ruff_version }}

  lint_copyright:
    name: Copyright
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          src: MDMC
          args: check --preview --select CPY
          version: ${{ env.ruff_version }}

  type-checking:
    name: Mypy
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: apt get
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin
    - name: pip3 install
      run: |
        sudo pip3 install --upgrade pip
        sudo pip3 install .[typecheck]
    - name: mypy
      run: |
        cd MDMC
        mypy . --show-error-codes --pretty
