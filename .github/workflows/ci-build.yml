name: CI
# contains jobs which run on every pull request
on: 
  pull_request:
  schedule:
  - cron:  '30 20 * * 0' # runs at 8:30pm on Sundays alongside jobs in ci-cron.yml
    branches:
    - master

jobs:
  build:
    name: Build docker container
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2
    - name: fetch  # grabs other branches to check if Docker files changed
      run: |
        git config remote.origin.fetch +refs/heads/*:refs/remotes/origin/* 
        git fetch --unshallow --tags

    - name: Check and build container
      env: 
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        BRANCH: ${{ github.head_ref }} 
      run: source .github/scripts/build_container.sh
      
  engine_tests:
    name: Docker MD tests
    needs: build # so it can use new docker image if docker image has changed
    runs-on: ubuntu-20.04
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: apt-get
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin
        
    - name: Run tests
      env: 
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        BRANCH: ${{ github.head_ref }} 
        TESTSET: lammps
      run: source .github/scripts/docker_testing.sh

    - name: Copy coverage
      run: docker cp $(docker ps -lq):/home/coverage.xml coverage.xml

    - name: Upload code coverage report
      uses: codecov/codecov-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  tests:
    name: Docker non-MD tests
    needs: build # so it can use new docker image if docker image has changed
    runs-on: ubuntu-20.04
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: apt-get
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin
        
    - name: Run tests
      env: 
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        BRANCH: ${{ github.head_ref }} 
        TESTSET: "not lammps"
      run: source .github/scripts/docker_testing.sh
      
    - name: Copy coverage
      run: docker cp $(docker ps -lq):/home/coverage.xml coverage.xml

    - name: Upload code coverage report
      uses: codecov/codecov-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  documentation:
    name: Documentation
    needs: build # so it can use new docker image if docker image has changed
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2
    - name: fetch  # grabs other branches to check if doc files changed
      run: |
        git config remote.origin.fetch +refs/heads/*:refs/remotes/origin/* 
        git fetch --unshallow --tags
    - name: Run script
      env:
        BRANCH: ${{ github.head_ref }} 
        EVENT_TYPE: ${{ env.GITHUB_EVENT_NAME }}
      run: source .github/scripts/documentation_testing.sh
