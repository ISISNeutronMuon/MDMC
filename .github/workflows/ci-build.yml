name: CI
# contains jobs which run on every pull request
on:
  pull_request:

env:
  ruff_version: 0.15.5

jobs:

  tests:
    name: Tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        testset: ["not lammps and not dlpoly"]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.2'
          architecture: x64
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install MDMC
        run: pip install .[test,docs]
      - name: Install packmol
        run: sudo apt-get install libgfortran5 -y && pip install packmol
      - name: Run tests
        working-directory: tests
        run: pytest

  linting:
    name: Lint - ${{ matrix.type }}
    strategy:
      fail-fast: false
      matrix:
        type: ["check", "format --check"]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          src: MDMC
          args: ${{ matrix.type }}
          version: ${{ env.ruff_version }}

  lint_copyright:
    name: Copyright
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          src: MDMC
          args: check --preview --select CPY
          version: ${{ env.ruff_version }}

  type-checking:
    name: Mypy
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: apt get
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin
    - name: pip3 install
      run: |
        sudo pip3 install --upgrade pip
        sudo pip3 install .[typecheck]
    - name: mypy
      run: |
        cd MDMC
        mypy . --show-error-codes --pretty
