name: CI
# contains jobs which run on every pull request
on: 
  pull_request:
  schedule:
  - cron:  '30 20 * * 0' # runs at 8:30pm on Sundays alongside jobs in ci-cron.yml
    branches:
    - master

jobs:
  engine_tests:
    name: Docker and including MD tests
    runs-on: ubuntu-20.04
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: apt-get
      run: sudo apt-get install -y libopenmpi-dev openmpi-bin

    - name: Run script
      env: 
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: source .github/scripts/docker_testing.sh
    - name: Copy coverage
      run: docker cp $(docker ps -lq):/home/coverage.xml coverage.xml

    - name: Upload code coverage report
      uses: codecov/codecov-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  documentation:
    name: Documentation
    needs: engine_tests # so it can use new docker image if docker image has changed
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2
    - name: Run script
      run: source .github/scripts/documentation_testing.sh
