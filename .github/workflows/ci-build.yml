name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    name: Build docker container
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2
    - name: fetch  # grabs master to compare if Docker build files changed
      run: git fetch origin master

    - name: Check and build container
      env: 
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        BRANCH: ${{ github.head_ref }} 
      run: |
          docker build -t mdmc/mdmc:ci-$BRANCH -f "$(pwd)"/build/Docker/Dockerfile . || exit 1 
          docker push mdmc/mdmc:ci-$BRANCH
  parallel_system_tests:
    name: Docker MPI tests
    needs: build
    runs-on: ubuntu-18.04
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.6'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: Docker pull
      env: 
        BRANCH: ${{ github.head_ref }} 
      run: docker pull mdmc/mdmc:ci-$BRANCH

    - name: Run tests
      env: 
        BRANCH: ${{ github.head_ref }} 
      # To avoid issues with both processes accessing the coverage report
      # simultaneously, first create the coverage file without mpi using a fake
      # PyTest mark so we don't actually run any tests. Then use the
      # --cov-append option for the actual tests. Using --allow-run-as-root as
      # we are running inside a docker container, so root only affects the
      # container. Usually running with this flag is *strongly* discouraged.
      run: docker run -t --mount type=bind,source=$(pwd),target=$(pwd) -w $(pwd) mdmc/mdmc:ci-$BRANCH /bin/bash -c 'pytest -s -m NONE $(pwd)/tests/ --cov=$(pwd)/MDMC --cov-report xml; mpirun --allow-run-as-root -np 2 pytest -s -m mpi $(pwd)/tests/ --cov=$(pwd)/MDMC --cov-report xml --cov-append'

