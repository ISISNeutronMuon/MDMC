name: cron
# contains jobs which run on a schedule rather than on a pull-request
on: 
  pull_request:
  schedule:
  - cron:  '30 20 * * 0' # runs at 8:30pm on Sundays
    branches:
      - master
  
jobs:
  docker_tests:
    name: Docker including MD tests
    runs-on: ubuntu-20.04
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v2
    - name: apt-get
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin
        
    - name: Run tests
      run: |
        docker pull mdmc/mdmc:latest
        docker run -t --mount type=bind,source="$(pwd)",target="$(pwd)" mdmc/mdmc:latest python3 -m pytest -s "$(pwd)"/tests/ --cov="$(pwd)"/MDMC --cov-report xml; [ $? -eq 0 ]
        
    - name: Uninstall
      run: pip3 uninstall -y MDMC
  basic_tests:
    name: Non-container and not inc MD tests
    runs-on: ubuntu-20.04
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: apt-get
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin
    - name: pip install
      run: |
        pip3 install --upgrade pip
        pip3 install -r requirements.txt
        pip3 install -r .dev_requirements.txt

    - name: Run tests
      run: python3 -m pytest -s $(pwd)/tests/ -m "not lammps"

    - name: Uninstall
      run: pip3 uninstall -y MDMC
      
  windows:
    name: Python 3.8.0 on Windows
    runs-on: windows-latest
    steps:
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
        architecture: x64
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: Install
      run: |
        pip3 install --upgrade pip
        pip3 install .

    - name: Uninstall
      run: pip3 uninstall -y MDMC
      
  singularity:
    name: Singularity tests
    runs-on: ubuntu-20.04
    steps:
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.13'
      - name: Get Singularity requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y flawfinder squashfs-tools uuid-dev libuuid1 libffi-dev libssl-dev libssl1.1 libarchive-dev libgpgme11-dev libseccomp-dev
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Setup Singularity
        run: source .github/scripts/singularity_setup.sh 
        
      - name: Run tests
        run: |
           singularity pull docker://mdmc/mdmc:latest
           singularity exec mdmc_latest.sif pip3 install --upgrade pip
           singularity exec mdmc_latest.sif pip3 install .
           singularity exec mdmc_latest.sif python3 -m pytest -s $(pwd)/tests/ 
       
