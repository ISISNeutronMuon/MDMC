name: deploy
# deployment jobs for when master is updated

on:
  pull_request:
    types: [closed]

# note that the workflow will be triggered whenever a PR is closed, but the "if:" line of the job means the job will only run if it is closed due to merge    
jobs:
  update-latest-image:
    name: Update Docker image
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - name: Update image
      env:
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        BRANCH: ${{ github.head_ref }} 
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "mdmc" --password-stdin
        docker pull mdmc/mdmc:ci-$BRANCH || exit 0  # exit as a success if fails to pull, as no branch exists to be pulled which is okay
        docker tag mdmc/mdmc:ci-$BRANCH mdmc/mdmc:latest
        docker push mdmc/mdmc:latest
