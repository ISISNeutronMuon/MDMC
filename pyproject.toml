# MDMC install config

# For full functionality MDMC requires one or more molecular dynamics (MD)
# engines to be installed. See 'optional-dependencies' for the currently
# supported engines.

[build-system]
requires = ["setuptools>=40.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MDMC"
version = "0.2"
description = "A package for optimising classical molecular dynamics parameters by refining against experimental data."
authors = [{name = "MDMC developers", email = "support@mdmcproject.org"}]
requires-python = ">=3.10"
dynamic = ["dependencies"]
readme = "README.md"
keywords = ["neutron scattering", "molecular dynamics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed"
  ]

[project.urls]
Homepage = "https://mdmcproject.org/"
Repository = "https://github.com/MDMCproject/MDMCv0.2_pilot.git"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]

### Note that these optional dependencies do not install the requisite molecular
# dynamics engine.
LAMMPS = ["pylammps"]
DLPOLY = ["dlpoly-py @ git+https://gitlab.com/ccp5/dlpoly-py.git"]
###

test = ["pytest==8.2.2",
        "pytest-cov==5.0.0",
        "pytest-cases==3.8.5",
        "pytest-profiling==1.7.0"]
lint = ["pylint==2.14.0",
        "pylint-exit==1.2.0"]
typecheck = ["mypy"]
docs = ["sphinx==8.0.0",
        "nbsphinx==0.9.4",
        "sphinx-rtd-theme==2.0.0",
        "docutils==0.18.1",
        "jupyter==1.0.0",
        "nbmake==1.5.4",
        "nbconvert==7.16.4",
        "lxml[html_clean]"]
all = ["MDMC[LAMMPS,DLPOLY,test,lint,typecheck,docs]"]

[project.scripts]
MDMC = "MDMC.utilities.cli:main"
