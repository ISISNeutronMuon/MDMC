# MDMC install config

# For full functionality MDMC requires one or more molecular dynamics (MD)
# engines to be installed. See 'optional-dependencies' for the currently
# supported engines.

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MDMC"
version = "0.2"
description = "A package for optimising classical molecular dynamics parameters by refining against experimental data."
authors = [{name = "MDMC developers", email = "support@mdmcproject.org"}]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "netCDF4==1.7.3",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "ase==3.24.0",
  "mpi4py==4.1.1",
  "scikit-learn==1.7.2",
  "scikit-optimize==0.10.2",
  "verbosemanager==1.3.0",
  "corner==2.2.3",
  "periodictable==1.7.1",
  "statsmodels==0.14.5",
  "cma==4.4.4",
  "h5py==3.16.0",
  "openmm==8.4.0",
  "networkx==3.4",
  "mdanse==2.0.1",
  "more_itertools==10.8.0",
]
keywords = ["neutron scattering", "molecular dynamics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed"
  ]
license = {file = "LICENSE"}

[project.urls]
Homepage = "https://mdmcproject.org/"
Repository = "https://github.com/MDMCproject/MDMCv0.2_pilot.git"

[project.optional-dependencies]

### Note that these optional dependencies do not install the requisite molecular
# dynamics engine.
LAMMPS = ["pylammps"]
DLPOLY = ["dlpoly-py @ git+https://gitlab.com/ccp5/dlpoly-py.git"]
###

test = ["pytest==9.0.3",
        "pytest-cov==7.1.0",
        "pytest-cases==3.9.1",
        "pytest-profiling==1.8.1"]
lint = ["ruff==0.15.5"]
typecheck = ["mypy==1.19.1"]
docs = ["sphinx==8.1.3",
        "nbsphinx==0.9.7",
        "sphinx-rtd-theme==3.0.2",
        "docutils==0.21.2",
        "ipython==8.38.0",
        "ipykernel==6.30.1",
        "jupyter==1.1.1",
        "nbmake==1.5.5",
        "nbconvert==7.17.1",
        "lxml[html_clean]"]
all = ["MDMC[LAMMPS,DLPOLY,test,lint,typecheck,docs]"]

[project.scripts]
MDMC = "MDMC.utilities.cli:main"

[tool.setuptools.packages.find]
include = ["MDMC*"]

[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",
    "SA01",
    "ES01",
]
# remember to use single quotes for regex in TOML
exclude = [  # don't report on objects that match any of these regex
    '\.__[^.]*__$',
]
override_SS05 = [  # override SS05 to allow docstrings starting with these words
    '^Process ',
    '^Assess ',
    '^Access ',
    '^Class ',
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py310"

# Exclude a variety of commonly ignored directories.
extend-exclude = [
    ".#*",
    "__pycache__",
    "*.ipynb",
    "tests/*",
    "examples/*",
    "doc/*",
    ".github/*",
]


[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
select = [
    "PLE", # Pylint errors
    "E",   # Pycodestyle
    "W",   # Pycodestyle warnings
    "F",   # Pyflakes
    "B",   # Flake8 bugbear
    "SIM", # Flake8 Simplify
    "A",   # Flake8 builtins
    "COM", # Flake8 commas
    "FA",  # Flake8 future
    "ISC", # Flake8 implicit string concat
    "RSE", # Flake8 raise
    "I",   # Isort
#    "RUF", # Ruff specific
#    "FURB",# Refurb
#    "PERF",# Perflint
#    "PL",  # Pylint
#    "NPY", # Numpy specific warnings
#    "PTH", # Flake8 use pathlib
#    "D",   # Pydocstyle
    "UP",  # Pyupgrade
#    "FBT", # Flake8 boolean trap
#    "C4",  # Flake8 comprehensions
#    "PT",  # Flake8 pytest style
#    "Q",   # Flake8 Quotes
#    "RET", # Flake8 return
#    "ARG", # Flake8 unused args

]
ignore = [
    "B028",  # No stacklevel in Warning
    "B905",  # No strict in zip
    "A003",  # Shadowing by attribute
    "UP015", # Don't use 'r' mode parameter
    "COM812",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.isort]
profile = "black"
known-first-party = ["MDMC"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-copyright]
author = "MDMC Developers"
