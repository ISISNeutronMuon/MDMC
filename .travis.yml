sudo: required

language: python

services:
  - docker

python:
  - "3.6"

notifications:
  email: false

before_install:
  - docker pull tfarmer/mdmc_dependencies:latest

script:
  - docker run -t --mount type=bind,source=$(pwd),target=$(pwd) tfarmer/mdmc_dependencies:latest /bin/bash -c "python3 -m pytest -s $(pwd)/tests/ --ignore=$(pwd)/tests/system_tests --cov --cov-report html && bash <(curl -s https://codecov.io/bash)"

branches:
  only:
    - master
    - travis_fix
