sudo: required

language: python

services:
  - docker

python:
  - "3.6"

notifications:
  email: false

before_install:
  - docker pull tfarmer/mdmc_dependencies:latest

script:
  - docker run -t --mount type=bind,source=$(pwd),target=$(pwd) tfarmer/mdmc_dependencies:latest python3 -m pytest --cov -s $(pwd)/tests/ --ignore=$(pwd)/tests/system_tests

afer_sucess:
  - codecov

branches:
  only:
    - master
    - travis_fix
