sudo: required

language: python

services:
  - docker

python:
  - "2.7"

notifications:
  email: false

before_install:
  - docker pull tfarmer/mdmc_dependencies:latest

script:
    - docker run --mount type=bind,source="$(pwd)",target="$(pwd)" tfarmer/mdmc_dependencies:latest python -m pytest -v "$(pwd)"/tests/

branches:
  only:
    - master
