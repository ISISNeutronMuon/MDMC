<html>

 <head>

  <title>MDMC atomic visualization</title>

  <link rel="stylesheet" type="text/css"

   href="https://www.x3dom.org/x3dom/release/x3dom.css">

  </link>

  <script type="text/javascript"

   src="https://www.x3dom.org/x3dom/release/x3dom.js">

  </script>

 </head>

 <body>

  <X3D width="800px" height="800px">

   <Scene>

   <Viewpoint centerOfRotation="0.00 0.82 0.29" position="0.00 0.82 3.22"></Viewpoint>

    <Transform translation="0.00 0.00 0.00">

     <Shape>

      <Appearance>

       <Material diffuseColor="1.000 1.000 1.000" specularColor="0.5 0.5 0.5">

       </Material>

      </Appearance>

      <Sphere radius="0.08">

      </Sphere>

     </Shape>

    </Transform>

    <Transform translation="0.00 0.82 0.58">

     <Shape>

      <Appearance>

       <Material diffuseColor="1.000 0.051 0.051" specularColor="0.5 0.5 0.5">

       </Material>

      </Appearance>

      <Sphere radius="0.17">

      </Sphere>

     </Shape>

    </Transform>

    <Transform translation="0.00 1.63 0.00">

     <Shape>

      <Appearance>

       <Material diffuseColor="1.000 1.000 1.000" specularColor="0.5 0.5 0.5">

       </Material>

      </Appearance>

      <Sphere radius="0.08">

      </Sphere>

     </Shape>

    </Transform>

    <Transform center="0 -0.5000 0" translation="0.0000 0.5000 0.0000" rotation="0.5774 0.0000 0.0000 0.6155">

     <Shape>

      <Appearance>

       <Material diffuseColor="0 0 0" specularColor="0.5 0.5 0.5">

       </Material>

      </Appearance>

      <Cylinder height="1.0000" radius="0.02">

      </Cylinder>

     </Shape>

    </Transform>

    <Transform center="0 -0.5000 0" translation="0.0000 1.3165 0.5774" rotation="-0.5774 0.0000 0.0000 0.6155">

     <Shape>

      <Appearance>

       <Material diffuseColor="0 0 0" specularColor="0.5 0.5 0.5">

       </Material>

      </Appearance>

      <Cylinder height="1.0000" radius="0.02">

      </Cylinder>

     </Shape>

    </Transform>

   </Scene>

  </X3D>

 </body>

</html>
